[project]
name = "nvidia-stock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Martin", email = "martin.jimenez.388@mi.unc.edu.ar" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
nvidia-stock = "nvidia_stock:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
